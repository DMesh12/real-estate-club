<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עברנו לאתר חדש | מילון מונחי נדל"ן - מועדון הנדל"ן</title>
    <meta name="description" content="מילון מונחי הנדל&quot;ן של מועדון הנדל&quot;ן עבר לכתובת חדשה.">

    <!-- Send anyone (and search engines) to the new site -->
    <link rel="canonical" href="https://real-estate-dictionary.vercel.app/">
    <meta http-equiv="refresh" content="5; url=https://real-estate-dictionary.vercel.app/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Heebo', sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 24px;
            background: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f5f9 55%, #e2e8f0 100%);
            color: #1e293b;
        }
        .card {
            position: relative; overflow: hidden;
            max-width: 460px; width: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 32px;
            padding: 52px 32px 44px;
            box-shadow: 0 30px 70px rgba(15,23,42,0.12);
            animation: rise 0.6s ease-out both;
        }
        /* Navy → gold → navy accent bar, echoing the new site's welcome modal */
        .card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(to right, #1e1b4b, #f59e0b, #1e1b4b);
        }
        @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .logo { width: 130px; height: auto; margin-bottom: 26px; filter: drop-shadow(0 8px 20px rgba(15,23,42,0.15)); }
        .badge {
            display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 2px;
            color: #d97706; text-transform: uppercase; margin-bottom: 14px;
        }
        h1 { font-size: 30px; font-weight: 900; color: #0f172a; margin-bottom: 12px; line-height: 1.25; }
        p { font-size: 16px; color: #64748b; line-height: 1.7; margin-bottom: 32px; }
        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: #0f172a; color: #ffffff; font-weight: 700; font-size: 18px;
            text-decoration: none; padding: 16px 36px; border-radius: 16px;
            box-shadow: 0 12px 26px rgba(15,23,42,0.25);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .btn:hover { transform: translateY(-2px); background: #1e1b4b; box-shadow: 0 16px 34px rgba(15,23,42,0.32); }
        .note { margin-top: 24px; font-size: 13px; color: #94a3b8; }
        .note a { color: #d97706; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <main class="card">
        <img src="logo.png" alt="מועדון הנדל&quot;ן" class="logo">
        <span class="badge">מועדון הנדל"ן · אוניברסיטת רייכמן</span>
        <h1>עברנו לבית חדש 🏡</h1>
        <p>מילון מונחי הנדל"ן עבר לאתר חדש, מהיר ומשופר —<br>עם חיפוש חכם, מחשבונים ועוזר AI חינמי.</p>
        <a class="btn" href="https://real-estate-dictionary.vercel.app/">כניסה לאתר החדש ←</a>
        <p class="note">מועברים אוטומטית בעוד <span id="count">5</span> שניות… אם לא, <a href="https://real-estate-dictionary.vercel.app/">לחצו כאן</a>.</p>
    </main>
    <script>
        // Reliable redirect (more robust than meta-refresh): counts down then
        // replaces the URL so the old page doesn't stay in the back button.
        (function () {
            var TARGET = 'https://real-estate-dictionary.vercel.app/';
            var n = 5;
            var el = document.getElementById('count');
            var t = setInterval(function () {
                n -= 1;
                if (el) el.textContent = n;
                if (n <= 0) { clearInterval(t); window.location.replace(TARGET); }
            }, 1000);
        })();
    </script>
</body>
</html>
